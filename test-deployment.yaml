apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - name: test-app
          # Best practice: use a specific version instead of :latest
          image: nginx:1.25.3 
          securityContext:
            # FIX: Explicitly prevent escalation
            allowPrivilegeEscalation: false
            # Additional hardening:
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
